services:
  postgres:
    image: postgres:15
    container_name: postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cria o banco usado por `npm run test:e2e`. O `POSTGRES_DB` acima só cria um
  # banco, e os scripts de initdb do Postgres rodam uma vez só, em volume novo —
  # o que deixaria de fora justamente quem já tem o volume. Este serviço roda a
  # cada `up`, é idempotente, e por isso conserta os dois casos.
  postgres-setup:
    image: postgres:15
    container_name: postgres_setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: >
      /bin/sh -c "
        psql -h postgres -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='app_test'\" | grep -q 1 ||
        psql -h postgres -U postgres -c 'CREATE DATABASE app_test' &&
        echo 'Test database ready.'
      "

  minio:
    image: minio/minio:latest
    container_name: minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    container_name: minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/real-estate-dev &&
        mc anonymous set public local/real-estate-dev &&
        echo 'MinIO bucket ready.'
      "

volumes:
  postgres_data:
  minio_data:
