# Este workflow NÃO faz deploy e NÃO roda `prisma migrate deploy` contra produção.
# Seu único propósito é produzir um status check no commit exato que cai na `main`,
# para o Render (configurado em modo "After CI Checks Pass") saber que pode
# buildar/deployar com segurança. O `render-build` (package.json) já roda
# `prisma migrate deploy` como parte do próprio build do Render — duplicar isso
# aqui exigiria credenciais de produção como GitHub Secret sem nenhum benefício.
#
# O Postgres/.env.test usado aqui é uma instância efêmera e isolada, sem
# nenhuma relação com o banco de produção.
name: CD

on:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_test
          CORS_ORIGIN=http://localhost:3000
          JWT_SECRET=test-jwt-secret-must-be-at-least-32-chars!
          JWT_REFRESH_SECRET=test-refresh-secret-must-be-at-least-32!!
          ADMIN_SECRET=test-admin-secret-must-be-at-least-32-ch!
          RUN_SEED=true
          EOF

      - name: Migrate test database
        run: npm run db:migrate:test

      - name: Seed test database
        run: npm run db:seed:test

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e
