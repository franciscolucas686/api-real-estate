# Portão + deploy da produção, nesta ordem e numa execução só.
#
# O job `deploy` declara `needs: verify`, então ele não pode começar antes do gate
# passar — a dependência é real, não uma corrida entre dois workflows. Era assim
# que o arranjo anterior funcionava com o Render, que lia o status check pela API
# do GitHub; com o Fly o deploy é nosso, então a ordem vira explícita aqui.
#
# Este workflow continua NÃO rodando `prisma migrate deploy` contra produção. Quem
# faz isso é o `release_command` do fly.toml, que roda depois do build e antes de a
# versão nova receber tráfego — trazer a migração para cá exigiria a DATABASE_URL de
# produção como GitHub Secret sem nenhum benefício.
#
# O Postgres/.env.test usado no gate é uma instância efêmera e isolada, sem
# nenhuma relação com o banco de produção.
name: CD

on:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/app_test
          CORS_ORIGIN=http://localhost:3000
          JWT_SECRET=test-jwt-secret-must-be-at-least-32-chars!
          JWT_REFRESH_SECRET=test-refresh-secret-must-be-at-least-32!!
          ADMIN_SECRET=test-admin-secret-must-be-at-least-32-ch!
          RUN_SEED=true
          EOF

      - name: Migrate test database
        run: npm run db:migrate:test

      - name: Seed test database
        run: npm run db:seed:test

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  deploy:
    name: deploy
    needs: verify
    runs-on: ubuntu-latest
    # Um deploy por vez: dois pushes seguidos na main não podem disputar a mesma
    # máquina, e o `release_command` do fly.toml roda migração — duas execuções
    # simultâneas de `prisma migrate deploy` contra o mesmo banco é o pior caso.
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v5

      # Pinado em `v1` em vez de `master`: esta action roda com o FLY_API_TOKEN no
      # ambiente, então seguir um branch móvel entrega deploy de produção a qualquer
      # commit que apareça no upstream.
      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
