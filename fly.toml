# fly.toml app configuration file generated for api-real-estate on 2026-08-15T16:48:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'api-real-estate'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'
  seed_command = './node_modules/.bin/ts-node -P tsconfig.seed.json prisma/seed.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
